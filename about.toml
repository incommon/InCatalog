# cargo-about — third-party attribution generation.
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
# Produces the aggregated dependency license/copyright notices shipped in the
# container image (Apache-2.0 §4 + the MIT/BSD/ISC attribution clauses).
# The accepted set mirrors deny.toml's allow-list.

# Pin to the Linux deployment targets so the generated file is host-independent
# (identical whether generated on a dev macOS box or the Linux CI runner) and
# reflects exactly what ships in the linux/arm64 image.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Dev-dependencies aren't distributed in the binaries/image.
ignore-dev-dependencies = true

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

# The per-crate MPL-2.0 exceptions in deny.toml (Servo's CSS engine, via scraper).
[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]
