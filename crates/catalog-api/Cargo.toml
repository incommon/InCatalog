[package]
name = "catalog-api"
description = "HTTP API for the federation service catalog (local server or AWS Lambda)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
lambda_http.workspace = true
catalog-claude.workspace = true
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "fs", "trace", "set-header"] }
catalog-core.workspace = true
catalog-store.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
