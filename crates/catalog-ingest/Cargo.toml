[package]
name = "catalog-ingest"
description = "Fetch InCommon and eduGAIN metadata and publish a service catalog snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
lambda_runtime.workspace = true
clap = { version = "4", features = ["derive", "env"] }
catalog-core.workspace = true
catalog-store.workspace = true
catalog-claude.workspace = true
scraper = "0.29"
futures = "0.3"
url.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }
axum = "0.8"
aws-credential-types = "1.3"
