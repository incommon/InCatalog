name: Build image

# Builds the one container image both Lambda functions run (the Dockerfile),
# smoke-tests it (infra/test-image.sh), and pushes it to ECR.
#
# ARCHITECTURE: the functions run on arm64 (Graviton), so the image MUST be
# linux/arm64. It is built on a native arm64 runner (fast, no QEMU).
#
# TAGGING and PROMOTION:
#   - push to develop  -> builds, tests and pushes :<sha>. Nothing deploys.
#   - push of a v<semver> release tag (CONTRIBUTING.md § Versioning) -> the
#     same, and also pushes :v<semver>. The tag must name the Cargo.toml
#     version, or the build fails. Nothing deploys.
#   - workflow_dispatch -> builds, tests and pushes :<sha>, and also moves
#     :latest to that image.
# Every image carries the Cargo.toml version as its
# org.opencontainers.image.version label.
# OpenTofu deploys whatever :latest points at (var.image_tag, pinned by
# digest), so `tofu apply` after a dispatch ships it. Promotion is a
# deliberate act, as in `make deploy`; a merge never changes what is live.
#
# PREREQUISITES (one-time), on the GitHub Environment `dev`:
#   1. Apply infra/terraform with `github_oidc_provider_arn` set, which creates
#      the push role, then set its output `github_image_push_role_arn` as the
#      AWS_ROLE_ARN *variable* (not a secret).
#   2. Set ECR_REPOSITORY to the repository's name (the `ecr_repository_url`
#      output, after the slash).
# Keyless via GitHub OIDC — no long-lived AWS keys in GitHub. Until both are
# set, the job builds and tests the image, then skips the push with a warning.

on:
  push:
    branches: [develop]
    # GitHub does not apply the paths filter below to tag pushes.
    tags: ["v*"]
    paths:
      - "crates/**"
      - "web/**"
      - "certs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "LICENSE"
      - "NOTICE"
      - "about.toml"
      - "about.hbs"
      - "infra/test-image.sh"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

# One in-flight build per event and ref: a newer push to develop supersedes an
# older one, but never cancels a release-tag build or a promotion run (which
# a single shared group did: merging into develop cancelled v0.2.0's build).
concurrency:
  group: build-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # mint the OIDC token aws-actions/configure-aws-credentials exchanges for the push role

env:
  AWS_REGION: us-east-2
  IMAGE: incatalog:ci

jobs:
  build:
    name: image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    # Binds this job to the GitHub Environment holding the AWS variables (and
    # any required-reviewer protection).
    environment: dev
    steps:
      - uses: actions/checkout@v7

      # The one version: the workspace version in Cargo.toml. A release tag
      # must match it, so :v<semver> never names a build of another version.
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::No workspace version in Cargo.toml."; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Loaded into the runner's Docker, not pushed, so the smoke test runs on
      # exactly the image that is pushed next.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Without data/cache the signature step is skipped; the contents,
      # certificate pins, fixture ingest and serving checks all run.
      - name: Smoke test
        run: ./infra/test-image.sh

      - name: Check push configuration
        id: cfg
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          REPO: ${{ vars.ECR_REPOSITORY }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$REPO" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AWS_ROLE_ARN or ECR_REPOSITORY is not set on the 'dev' environment; the image was built and tested but not pushed. See this workflow's header."
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.cfg.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.cfg.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push
        if: steps.cfg.outputs.push == 'true'
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          PROMOTE: ${{ github.event_name == 'workflow_dispatch' }}
          RELEASE: ${{ github.ref_type == 'tag' && format('v{0}', steps.version.outputs.version) || '' }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE" "$REPO:$GITHUB_SHA"
          docker push -q "$REPO:$GITHUB_SHA"
          if [ -n "$RELEASE" ]; then
            docker tag "$IMAGE" "$REPO:$RELEASE"
            docker push -q "$REPO:$RELEASE"
            echo "Pushed release :$RELEASE." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PROMOTE" = "true" ]; then
            docker tag "$IMAGE" "$REPO:latest"
            docker push -q "$REPO:latest"
            echo "Promoted $GITHUB_SHA to :latest — \`tofu apply\` deploys it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pushed :$GITHUB_SHA (not promoted; run this workflow manually to move :latest)." >> "$GITHUB_STEP_SUMMARY"
          fi
