name: CI

# The Rust suite runs when Rust-relevant files change; a docs-only PR skips it
# (CONTRIBUTING.md § Testing). The required check "fmt / clippy / test /
# coverage" is reported by the `rust-gate` job at the bottom, which ALWAYS runs
# — a required check that never reports would block a PR forever, which is what
# a workflow-level `paths:` filter would cause.
on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What changed in this PR? Pushes to the long-lived branches always count as
  # code: they are the integration record, and re-proving them is cheap
  # insurance against a bad merge commit.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # "Code" is anything the Rust suite reads, which is more than *.rs:
      #   - crates/**/tests/fixtures — the pipeline test parses them
      #   - .coverage-threshold      — the coverage gate reads it
      #   - this workflow            — a CI change must prove itself
      # Everything else (web/, infra/, the top-level markdown) is covered by the
      # other jobs or by review.
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files:"; echo "$changed" | awk '{ print "  " $0 }'
          # Markdown is prose wherever it lives: a README inside a crate
          # directory is not code, and no test reads a .md file.
          changed="$(echo "$changed" | grep -v '\.md$' || true)"
          code_re='^crates/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.coverage-threshold$|^\.github/workflows/ci\.yml$'
          if echo "$changed" | grep -Eq "$code_re"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Rust suite: **running**"
              echo "Code-relevant files changed:"
              echo '```'
              echo "$changed" | grep -E "$code_re"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Rust suite: **skipped**"
              echo "No Rust-relevant file changed (CONTRIBUTING.md § Testing)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  rust:
    name: Rust suite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain; rustup picks it up. llvm-tools
      # is for the coverage gate and is not in the pinned component list, which
      # every contributor would otherwise download.
      - name: Install toolchain
        run: |
          rustup show
          rustup component add llvm-tools-preview

      # BEFORE the cache restore: the cache saved at the end of a successful run
      # contains the instrumented llvm-cov target directory too, and restoring it
      # on a fresh runner can overflow the disk before any step runs. That
      # failure is invisible — the runner dies writing its own log, leaving only
      # "No space left on device" in the run's annotations.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # The org allows only GitHub-owned and verified-creator actions, so this is
      # actions/cache rather than a Rust-specific cache action. ~/.cargo/bin
      # holds cargo-llvm-cov between runs (but not cargo's install records, so
      # the install step checks the version itself).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # A cached binary comes back without cargo's install records, and
      # `cargo install` then refuses to overwrite it; hence the version check.
      - name: Install cargo-llvm-cov
        run: |
          cargo llvm-cov --version 2>/dev/null | grep -qx 'cargo-llvm-cov 0.8.7' \
            || cargo install --locked --force cargo-llvm-cov@0.8.7

      - name: Coverage gate (ratchet-up only — see CONTRIBUTING.md)
        run: |
          set -euo pipefail
          # Thresholds live in .coverage-threshold as key=value. Read them
          # explicitly rather than sourcing the file, and fail loudly on a
          # missing key — a silently empty threshold would disable the gate.
          threshold() {
            local value
            value="$(grep -E "^$1=" .coverage-threshold | cut -d= -f2 | tr -d '[:space:]')"
            if [ -z "$value" ]; then
              echo "::error::.coverage-threshold has no '$1' entry — refusing to run an unbounded coverage gate." >&2
              exit 1
            fi
            echo "$value"
          }
          lines="$(threshold lines)"
          regions="$(threshold regions)"
          functions="$(threshold functions)"
          echo "gates: lines >= $lines, regions >= $regions, functions >= $functions"
          # main.rs files are process bootstrap, excluded from measurement per
          # CONTRIBUTING.md. Branch coverage is absent from this list because it
          # is not measured on stable (see .coverage-threshold).
          cargo llvm-cov --workspace --ignore-filename-regex '(^|/)main\.rs$' \
            --fail-under-lines "$lines" \
            --fail-under-regions "$regions" \
            --fail-under-functions "$functions"

  # The branch-protection check. Its NAME is what `main` requires, so it must
  # not be renamed without updating branch protection. It always runs, so the
  # check always reports: green when the suite passed, green when the suite was
  # legitimately not needed, red otherwise. `if: always()` is what makes it run
  # even though `rust` was skipped; the explicit result test below is what stops
  # a skipped or cancelled suite from being mistaken for a passing one.
  rust-gate:
    name: fmt / clippy / test / coverage
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the Rust suite when code changed
        run: |
          set -euo pipefail
          code='${{ needs.changes.outputs.code }}'
          result='${{ needs.rust.result }}'
          echo "code changed: $code / rust suite: $result"
          if [ "$code" != "true" ]; then
            if [ "${{ needs.changes.result }}" != "success" ]; then
              echo "::error::Change detection did not complete (${{ needs.changes.result }}) — refusing to pass."
              exit 1
            fi
            echo "No Rust-relevant change; the suite was not required for this PR."
            exit 0
          fi
          if [ "$result" != "success" ]; then
            echo "::error::Rust suite did not pass (result: $result)."
            exit 1
          fi
          echo "Rust suite passed."

  # Also a required check on `main`, by this name.
  terraform:
    name: terraform fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to .terraform-version, the version that applies the stack
      # (`make deploy`). Left to "latest", CI would eventually validate against
      # a binary no deploy runs.
      - name: Read the pinned Terraform version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.pin.outputs.version }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infra/

      # -lockfile=readonly: if the lock does not already satisfy the config,
      # fail here rather than at apply time against live infrastructure.
      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly >/dev/null
          terraform -chdir=infra/terraform validate

  licenses:
    name: license policy / third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup show

      # Installed with cargo rather than their own actions, which the org's
      # allow-list (GitHub-owned and verified creators only) does not admit.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
          key: license-tools-${{ runner.os }}-deny-0.20.2-about-0.9.1
      - name: Install cargo-deny and cargo-about
        run: |
          cargo deny --version 2>/dev/null | grep -qx 'cargo-deny 0.20.2' \
            || cargo install --locked --force cargo-deny@0.20.2
          cargo about --version 2>/dev/null | grep -qx 'cargo-about 0.9.1' \
            || cargo install --locked --force --features cli cargo-about@0.9.1

      # Enforce the permissive-only license allow-list (deny.toml). A
      # dependency under a non-permissive license fails here.
      - name: cargo-deny (license policy)
        run: cargo deny check licenses

      # The shipped THIRD-PARTY-LICENSES.html must match what about.toml +
      # the current Cargo.lock produce. Generated --offline, from the crates'
      # own files only, as `make notices` does: online, cargo-about also asks
      # clearlydefined.io and the crates' git repositories, whose answers vary
      # from run to run, and the check would fail on files nobody changed.
      - name: Third-party notices are up to date
        run: |
          cargo fetch --locked
          cargo about generate --offline --locked about.hbs -o /tmp/THIRD-PARTY-LICENSES.html
          if ! diff -q THIRD-PARTY-LICENSES.html /tmp/THIRD-PARTY-LICENSES.html; then
            diff THIRD-PARTY-LICENSES.html /tmp/THIRD-PARTY-LICENSES.html | head -40 || true
            echo "::error::THIRD-PARTY-LICENSES.html is stale — regenerate with: make notices"
            exit 1
          fi
