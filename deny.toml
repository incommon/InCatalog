# cargo-deny — supply-chain policy.
#
# Two consumers read this file:
#   - the always-on `licenses` CI job runs `cargo deny check licenses`
#     (.github/workflows/ci.yml) and reads only the [licenses] section;
#   - the weekly `security-audit` workflow runs `cargo deny check advisories
#     sources` (.github/workflows/security-audit.yml) and reads [advisories]
#     and [sources]. That scan is a scheduled signal, not a PR gate: Dependabot
#     (.github/dependabot.yml) opens the version-bump PRs that clear advisories,
#     and the scan reports on a cadence independent of code changes so a newly
#     published RustSec advisory surfaces even when nothing has merged.
#
# The project ships under Apache-2.0; every dependency must be usable under a
# permissive license compatible with that. Anything outside the allow-list
# (GPL/AGPL/MPL/EUPL/…) fails CI, so a copyleft dependency can't slip in
# unnoticed. SPDX `OR` expressions pass if any arm is allowed; `AND` expressions
# (e.g. ring's) require every component to be allowed.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # Community Data License Agreement – Permissive 2.0: the Mozilla CA root
    # bundle in webpki-roots. Permissive, redistributable.
    "CDLA-Permissive-2.0",
]

# MPL-2.0 is allowed for these crates only, not tree-wide. They are Servo's CSS
# engine, reached only through `scraper` (catalog-ingest's logo finder). MPL-2.0
# is file-level copyleft: it binds changes to these crates' own files, which we
# use unmodified from crates.io, and is compatible with distributing the whole
# under Apache-2.0. A new MPL dependency still fails until it is reviewed and
# listed here.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
]

# RustSec advisory scanning (weekly `security-audit` workflow). A yanked crate
# or any advisory fails the scan. The tree is clean: the AWS SDK's legacy
# rustls-0.21 connector and SigV4a (which carried h2 0.3, rustls 0.21,
# rustls-webpki 0.101 and crypto-bigint 0.5) are switched off in Cargo.toml.
#
# If an advisory ever has no upstream fix, ignore it here by ID with a
# rationale and a re-review date in `reason` — cargo-deny has no expiry field.
# A new issue gets a new ID, so it still fails the scan.
[advisories]
version = 2
yanked = "deny"
ignore = []

# Where crates may come from: crates.io only. An unexpected registry or git
# dependency fails the scan.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
